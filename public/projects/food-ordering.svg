<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Purple gradient background -->
  <rect width="1200" height="800" fill="url(#paint0_linear)"/>
  
  <!-- Mobile phone frames (4 screens) -->
  <g opacity="0.3">
    <!-- Screen 1 -->
    <rect x="100" y="150" width="200" height="400" rx="20" fill="#FFFFFF" opacity="0.1"/>
    <circle cx="200" cy="300" r="60" fill="#FFFFFF" opacity="0.15"/>
    
    <!-- Screen 2 -->
    <rect x="350" y="150" width="200" height="400" rx="20" fill="#FFFFFF" opacity="0.1"/>
    <rect x="380" y="220" width="140" height="80" rx="10" fill="#6C63FF" opacity="0.3"/>
    
    <!-- Screen 3 -->
    <rect x="600" y="150" width="200" height="400" rx="20" fill="#FFFFFF" opacity="0.1"/>
    <circle cx="700" cy="300" r="70" fill="#FFD93D" opacity="0.2"/>
    
    <!-- Screen 4 -->
    <rect x="850" y="150" width="200" height="400" rx="20" fill="#FFFFFF" opacity="0.1"/>
    <rect x="880" y="480" width="140" height="40" rx="20" fill="#6C63FF" opacity="0.3"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="680" font-family="'Manrope', sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    Food Ordering
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="730" font-family="'DM Sans', sans-serif" font-size="28" fill="#E0D4FF" text-anchor="middle">
    Gebeta Meal • Enjoy your Food
  </text>
  
  <!-- Decorative food icons -->
  <circle cx="200" cy="650" r="30" fill="#FFD93D" opacity="0.3"/>
  <circle cx="1000" cy="680" r="40" fill="#FF6B9D" opacity="0.25"/>
  <circle cx="150" cy="200" r="50" fill="#6C63FF" opacity="0.2"/>
  <circle cx="1050" cy="250" r="45" fill="#FFD93D" opacity="0.2"/>
  
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C6FFF"/>
      <stop offset="1" stop-color="#5B4FCC"/>
    </linearGradient>
  </defs>
</svg>
